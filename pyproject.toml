
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-loop-model-retraining"
version = "0.1.0"
description = "Closed loop model retraining project."
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.12,<3.13"  # Since your machine is on 3.12, let's target it explicitly
dependencies = [
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<1.6",
    "numpy>=1.24,<2.1",       # Kept under 2.1 to prevent Numba/SHAP compilation friction
    "lightgbm>=4.6.0",
    "mlflow>=2.21.3",
    "skl2onnx>=1.16.0",
    "shap>=0.46.0",            # Force a modern version to stop it from falling back to old numba
    "pytest>=7.0"
]

[tool.setuptools.packages.find]
exclude = ["data*", "models*"]